name: Deploy CISCaRL Live to GitHub Pages

on:
  push:
    branches: [live]
    paths:
      - "webapp/static/**"
      - "deliverables/visual-guide/**"
      - ".github/workflows/pages-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Assemble one site: the live app at /, the visual guide at /guide/
      - name: Assemble site
        run: |
          mkdir -p _site/guide
          cp -r webapp/static/. _site/
          cp -r deliverables/visual-guide/. _site/guide/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
